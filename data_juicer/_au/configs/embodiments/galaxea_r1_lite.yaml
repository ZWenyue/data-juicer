# Galaxea R1 Lite → Qwen-RobotManip 80-dim unified layout
# Hardware j1..j6 (0-based src indices 0..5) → canonical semantic slots.
# R1 Lite has no shoulder_roll DoF → slot 1 padded.
#   slot0 shoulder_pitch ← j2 (Y)
#   slot1 shoulder_roll  ← pad
#   slot2 shoulder_yaw   ← j1 (Z)
#   slot3 elbow_pitch    ← j3 (Y)
#   slot4 forearm_roll   ← j5 (Z)
#   slot5 wrist_pitch    ← j4 (Y)
#   slot6 wrist_roll     ← j6 (X)
name: galaxea_r1_lite

arms:
  left:
    joint_map:
      shoulder_pitch: 1   # j2
      shoulder_roll: null # pad (no DoF)
      shoulder_yaw: 0     # j1
      elbow_pitch: 2      # j3
      forearm_roll: 4     # j5
      wrist_pitch: 3      # j4
      wrist_roll: 5       # j6
    joint_sign: [1, 1, 1, 1, 1, 1, 1]
    source:
      state_column: observation.state.left_arm
      action_column: action.left_arm
    gripper:
      state_column: observation.state.left_gripper
      action_column: action.left_gripper
    eef:
      state_column: observation.state.left_ee_pose
      rot_repr: quat_wxyz
      # action EEF (camera-frame delta) deferred
    hand: null
  right:
    joint_map:
      shoulder_pitch: 1   # j2
      shoulder_roll: null # pad (no DoF)
      shoulder_yaw: 0     # j1
      elbow_pitch: 2      # j3
      forearm_roll: 4     # j5
      wrist_pitch: 3      # j4
      wrist_roll: 5       # j6
    joint_sign: [1, 1, 1, 1, 1, 1, 1]
    source:
      state_column: observation.state.right_arm
      action_column: action.right_arm
    gripper:
      state_column: observation.state.right_gripper
      action_column: action.right_gripper
    eef:
      state_column: observation.state.right_ee_pose
      rot_repr: quat_wxyz
    hand: null

shared:
  # Shared region [58:80].
  # Chassis state 6D = position(3) + feedback velocity(3).
  # Chassis action is ROS twist 6D (linear xyz + angular xyz) in this dataset.
  chassis:
    state_columns:
      - observation.state.chassis
      - observation.state.chassis.velocities
    action_column: action.chassis.velocities
    action_source_indices: [0, 1, 2, 3, 4, 5]
    slots: [0, 1, 2, 3, 4, 5]
  torso:
    state_column: observation.state.torso
    action_column: action.torso.velocities
    action_source_indices: [0, 1, 2, 3]
    slots: [6, 7, 8, 9]

# Embodiment-prompt metadata (raw fields for training; no speed binning here).
prompt:
  embodiment_id: galaxea_r1_lite
  default_camera_view_direction: opposite side
  camera_views:
    observation.images.head_rgb: opposite side
    observation.images.head_right_rgb: opposite side
    observation.images.left_wrist_rgb: arm side
    observation.images.right_wrist_rgb: arm side
