# Ego → R1 Lite robot-view recipe (hand action + smooth + render + export).
#
# Weight paths aligned with demos/ego_hand_action_annotation/vla_pipeline.py:
#   - MoGe: HuggingFace id Ruicheng/moge-2-vitl (local cache under ~/.cache/huggingface)
#   - HaWoR: ~/.cache/data_juicer/models/HaWor/ (auto-download if missing)
#   - MANO: /mnt/r/share/zwy/Projects/mano_v1_2/models/
#
# Override via env in process.sh / internal/07 (MOGE_MODEL_PATH, MANO_*, FRAME_NUM, …).

project_name: 'ego-to-robot-hand2robot'
# MegaSaM needs CUDA ext (lietorch/droid_backends) from conda env mega-sam;
# only Ray honors per-op runtime_env. Start Ray first: ray start --head
executor_type: 'ray'
ray_address: 'auto'
dataset_path: './demos/ego_hand_action_annotation/data/demo-dataset.jsonl'
export_path: './b/d/hand2robot/runs/ego_process/processed.jsonl'
skip_op_error: false       # fail loud — do not silently drop samples

# Load _au operators (video_hand_to_robot_render_mapper)
custom_operator_paths:
  - data_juicer/_au

process:
  - video_extract_frames_mapper:
      # Prefer sparse sampling for hand→robot (full keyframes can be 10k+ frames/video)
      frame_sampling_method: 'uniform'
      frame_num: 30
      output_format: 'path'
      frame_dir: './b/d/hand2robot/runs/ego_process/frames'
      frame_field: 'video_frames'
      legacy_split_by_text_token: false
      video_backend: 'ffmpeg'
      batch_mode: true

  - video_camera_calibration_moge_mapper:
      model_path: 'Ruicheng/moge-2-vitl'
      tag_field_name: 'camera_calibration_moge_tags'
      frame_field: 'video_frames'
      output_depth: true
      output_points: false
      output_mask: false
      batch_mode: true

  - video_hand_reconstruction_hawor_mapper:
      # Prefer absolute cache paths so Ray workers do not re-wget "hawor.ckpt"
      hawor_model_path: '/home/physical/.cache/data_juicer/models/HaWor/hawor.ckpt'
      hawor_config_path: '/home/physical/.cache/data_juicer/models/HaWor/model_config.yaml'
      hawor_detector_path: '/home/physical/.cache/data_juicer/models/HaWor/detector.pt'
      camera_calibration_field: 'camera_calibration_moge_tags'
      tag_field_name: 'hand_reconstruction_hawor_tags'
      mano_right_path: '/mnt/r/share/zwy/Projects/mano_v1_2/models/MANO_RIGHT.pkl'
      mano_left_path: '/mnt/r/share/zwy/Projects/mano_v1_2/models/MANO_LEFT.pkl'
      frame_field: 'video_frames'
      batch_mode: true

  # Requires conda env mega-sam (lietorch/droid_backends). See b/vla_pipeline_env_setup.md
  - video_camera_pose_megasam_mapper:
      tag_field_name: 'video_camera_pose_tags'
      camera_calibration_field: 'camera_calibration_moge_tags'
      batch_mode: true
      runtime_env: {'conda': 'mega-sam'}

  - video_hand_action_compute_mapper:
      hand_reconstruction_field: 'hand_reconstruction_hawor_tags'
      camera_pose_field: 'video_camera_pose_tags'
      tag_field_name: 'hand_action_tags'
      hand_type: 'right'   # process.sh overrides via SIDE
      batch_mode: true

  - video_hand_motion_smooth_mapper:
      hand_action_field: 'hand_action_tags'
      savgol_window: 11
      savgol_polyorder: 3
      outlier_velocity_threshold: 5.0
      min_frames_for_smoothing: 5
      smooth_joints: true

  - video_hand_to_robot_render_mapper:
      robot_model_paths:
        right: 'b/d/urdf/generated/r1_lite_arm_right.xml'
        left: 'b/d/urdf/generated/r1_lite_arm_left.xml'
      calibration_path: 'b/d/hand2robot/calibration/r1_right_egodex_v2.yaml'
      hand_type: 'right'
      ik_solver: 'jacobian'
      hand_mask_method: 'joints_bbox_union'
      enable_depth_occlusion: true
      depth_epsilon_m: 0.02
      max_depth_invalid_ratio: 0.2
      output_frame_field: 'robot_render_frames'
      quality_field: 'hand_to_robot_render_quality'
      output_root: './b/d/hand2robot/runs/ego_process/robot_frames'
      gl_backend: 'egl'
      batch_mode: true

  - video_hand_action_caption_stub_mapper:
      hand_type: 'right'
      frame_field: 'robot_render_frames'
      tag_field_name: 'hand_action_caption'
      batch_mode: true

  - export_robot_render_lerobot_mapper:
      output_dir: './b/d/hand2robot/runs/ego_process/lerobot_dataset'
      hand_action_field: 'hand_action_tags'
      frame_field: 'robot_render_frames'
      encode_video_from_frames: true
      fps: 10
      robot_type: 'r1_lite_ego_retarget'
      batch_mode: true
